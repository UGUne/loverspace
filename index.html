<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="theme-color" content="#ff7ba9" />
<link rel="manifest" href="/manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="恋人空间" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />
<title>恋人空间</title>
<style>
  :root {
    --pink: #ff7ba9;
    --pink-deep: #f2558d;
    --pink-soft: #ffd9e6;
    --pink-bg: #fff0f5;
    --ink: #4a3b42;
    --ink-2: #9b8a92;
    --card: #ffffff;
    --line: #ffe4ee;
    --radius: 18px;
    --shadow: 0 6px 24px rgba(255, 119, 170, 0.16);
    --tab-h: 62px;
    --appbar-h: calc(52px + env(safe-area-inset-top));
    --sb-h: calc(26px + env(safe-area-inset-top));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  #boot{position:fixed;inset:0;z-index:99999;background:#ffa3c0;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;cursor:pointer}
  #boot.hide{opacity:0;pointer-events:none}
  #boot::after{content:"轻触任意位置跳过 \203A";position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.30);color:#fff;font-size:12px;letter-spacing:.5px;padding:7px 16px;border-radius:20px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  #bootImg{max-width:100%;max-height:100%;object-fit:contain;object-position:center}
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #ffeef4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  * { -webkit-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; -webkit-tap-highlight-color: transparent; }
  input, textarea, [contenteditable="true"], .editable { -webkit-user-select: text !important; user-select: text !important; -webkit-touch-callout: default !important; }
  #app {
    max-width: 100%;
    margin: 0 auto;
    min-height: 100dvh;
    background: linear-gradient(180deg, #ffd6e5 0%, #ffeef4 220px, #fff7fa 100%);
    position: relative;
    padding-top: calc(26px + env(safe-area-inset-top));
    padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
    overflow-x: hidden;
  }
  .app-statusbar { position: fixed; top: 0; left: 0; right: 0; height: var(--sb-h); padding: env(safe-area-inset-top) 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--pink), var(--pink-deep)); z-index: 120; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  .app-statusbar .sb-clock { font-variant-numeric: tabular-nums; flex: none; }
  .app-statusbar .sb-quote { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .95; text-align: right; }
  /* 状态栏常驻：普通模式与全屏模式均显示，用安全区避开系统状态栏 */
  .appbar {
    height: calc(52px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 16px 0;
    display: flex; align-items: center; gap: 8px;
    position: sticky; top: 0; z-index: 40;
    background: linear-gradient(180deg, #ffc9dc, #ffd6e5);
  }
  .appbar .logo {
    width: 32px; height: 32px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, #ff8fb5, #f2558d);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(242,85,141,.35);
  }
  .appbar h1 { font-size: 18px; font-weight: 700; color: #fff; flex: 1; text-shadow: 0 1px 3px rgba(242,85,141,.35); }
  .appbar .topbtn {
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.75); color: var(--pink-deep);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .appbar .topbtn:active { transform: scale(.92); }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  svg.ic.fill { fill: currentColor; stroke: none; }

  .view { display: none; padding: 14px 14px 0; animation: fadein .22s ease; }
  .view.on { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
  }
  .card-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--ink); }
  .card-title .t-ic { color: var(--pink); }
  .card-title .more { margin-left: auto; font-size: 12px; color: var(--ink-2); border: none; background: none; cursor: pointer; display: flex; align-items: center; gap: 2px; }

  .hero {
    background: linear-gradient(160deg, #ff9ec0, #f2558d);
    border-radius: 22px; padding: 22px 16px 18px; color: #fff;
    box-shadow: 0 10px 30px rgba(242,85,141,.35);
    position: relative; overflow: hidden; margin-bottom: 14px;
  }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.14); }
  .hero::before { width: 140px; height: 140px; top: -60px; right: -40px; }
  .hero::after { width: 90px; height: 90px; bottom: -40px; left: -20px; }
  .hero .couple { display: flex; align-items: center; justify-content: center; gap: 18px; position: relative; z-index: 1; }
  .avatar {
    width: 54px; height: 54px; border-radius: 50%; object-fit: cover;
    border: 3px solid rgba(255,255,255,.9); background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff; cursor: pointer; overflow: hidden; flex: none;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.img { border-color: rgba(255,255,255,.9); }
  .avatar.p0 { background: linear-gradient(135deg, #ffa5c4, #ff7ba9); }
  .avatar.p1 { background: linear-gradient(135deg, #8fc7ff, #5a9cf8); }
  .hero .heart-mid { color: #fff; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.22); } 24% { transform: scale(1); } 36% { transform: scale(1.15); } }
  .hero .days { text-align: center; margin-top: 12px; position: relative; z-index: 1; }
  .hero .days .num { font-size: 40px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .hero .days .num small { font-size: 15px; font-weight: 600; margin-left: 2px; }
  .hero .days .lbl { font-size: 12px; opacity: .92; margin-top: 2px; }
  .hero .names { display: flex; justify-content: center; gap: 40px; margin-top: 8px; font-size: 13px; position: relative; z-index: 1; opacity: .95; }
  .hero .namel, .hero .namer { width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }

  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .quick button { border: none; background: none; cursor: pointer; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink); }
  .quick button:active { transform: scale(.93); }
  .quick .q-ic { width: 46px; height: 46px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .quick .q-ic svg.ic { width: 22px; height: 22px; }
  .quick span { font-size: 11px; color: var(--ink-2); }

  .menu-list { padding: 4px 0; }
  .menu-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px 16px; border: none; background: none; cursor: pointer; font-size: 15px; color: var(--ink); text-align: left; border-bottom: 1px solid var(--line); }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: var(--pink-bg); }
  .menu-item .m-ic { color: var(--pink); flex: none; }
  .menu-item .sub { margin-left: auto; color: var(--ink-2); font-size: 13px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item .chev { color: #d9a8ba; flex: none; margin-left: 4px; }

  .anni-item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .anni-item:last-child { border-bottom: none; }
  .anni-date { width: 52px; height: 56px; border-radius: 12px; background: linear-gradient(160deg, #ff9ec0, #f2558d); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; box-shadow: 0 4px 10px rgba(242,85,141,.3); }
  .anni-date b { font-size:19px; line-height:1.1; }
  .anni-date i { font-style: normal; font-size: 10px; }
  .anni-info { flex: 1; min-width: 0; }
  .anni-info .t { font-size: 15px; font-weight: 600; }
  .anni-info .d { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .anni-count { text-align: right; flex: none; }
  .anni-count b { font-size: 20px; color: var(--pink-deep); }
  .anni-count i { font-style: normal; font-size: 11px; color: var(--ink-2); display: block; }
  .anni-count.today b { color: #fff; background: var(--pink-deep); border-radius: 8px; padding: 2px 8px; font-size: 13px; }
  .del-btn { border: none; background: none; color: #d9a8ba; cursor: pointer; padding: 6px; flex: none; }
  .del-btn:active { color: var(--pink-deep); }

  #view-chat { position: absolute; top: calc(var(--appbar-h) + var(--sb-h)); left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding: 0; display: none; overflow: hidden; }
  #view-chat.on { display: flex; flex-direction: column; }
  #view-chat .card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 0; margin: 0; width: 100%; }
  .chat-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; padding: 10px 12px 8px; }
  .bubble-row { display: flex; gap: 8px; align-items: flex-end; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: transform .12s ease; }
  .bubble-row.pressing .bubble { transform: scale(.94); opacity: .92; }
  .bubble-row.me { flex-direction: row-reverse; }
  .bubble-row .b-avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700; overflow: hidden; }
  .bubble-row .b-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .bubble { max-width: 68%; background: #fff; border-radius: 4px 14px 14px 14px; padding: 9px 12px; font-size: 14px; line-height: 1.5; box-shadow: 0 2px 8px rgba(255,119,170,.12); position: relative; word-break: break-word; }
  .bubble-row.me .bubble { background: linear-gradient(135deg, #ff8fb5, #f2558d); color: #fff; border-radius: 14px 4px 14px 14px; }
  .bubble .b-time { display: block; font-size: 10px; opacity: .55; margin-top: 4px; }
  .chat-empty { text-align: center; color: var(--ink-2); font-size: 13px; padding: 30px 0; }

  .chat-inputbar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 0 4px; background: linear-gradient(transparent, #fff 40%); }
  .chat-inputbar input { flex: 1; height: 42px; border: 1.5px solid var(--line); border-radius: 21px; padding: 0 16px; font-size: 14px; background: #fff; outline: none; color: var(--ink); }
  .chat-inputbar input:focus { border-color: var(--pink); }
  .send-btn { height: 42px; padding: 0 20px; border: none; border-radius: 21px; cursor: pointer; background: linear-gradient(135deg, #ff8fb5, #f2558d); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(242,85,141,.35); }
  .send-btn:active { transform: scale(.95); }

  .mood-bar { display: flex; justify-content: space-between; gap: 4px; }
  .mood-bar button { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); }
  .mood-bar button:active { transform: scale(.93); }
  .mood-bar button.on { border-color: var(--pink); background: var(--pink-bg); }
  .mood-bar .m-face { width: 26px; height: 26px; color: var(--ink-2); }
  .mood-bar button.on .m-face { color: var(--pink-deep); }
  .mood-bar span { font-size: 10px; color: var(--ink-2); }
  .mood-note { width: 100%; height: 38px; margin-top: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; font-size: 13px; outline: none; color: var(--ink); }
  .mood-note:focus { border-color: var(--pink); }

  .mood-tl { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .mood-tl:last-child { border-bottom: none; }
  .mood-tl .mt-face { width: 34px; height: 34px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-deep); display: flex; align-items: center; justify-content: center; flex: none; }
  .mood-tl .mt-face svg.ic { width: 20px; height: 20px; }
  .mood-tl .mt-body { flex: 1; min-width: 0; }
  .mood-tl .mt-head { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; }
  .mood-tl .mt-head b { color: var(--ink); font-size: 13px; }
  .mood-tl .mt-text { font-size: 14px; margin-top: 3px; }

  .tree-stage { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
  .grow-track { width: 100%; height: 10px; border-radius: 5px; background: var(--pink-soft); overflow: hidden; }
  .grow-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #ffb0cc, #f2558d); transition: width .6s ease; }
  .grow-lbl { font-size: 11px; color: var(--ink-2); margin-top: 6px; }
  .water-btn { margin-top: 14px; display: flex; align-items: center; gap: 8px; border: none; border-radius: 24px; padding: 12px 34px; cursor: pointer; background: linear-gradient(135deg, #7ec8ff, #4a9df3); color: #fff; font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(74,157,243,.4); }
  .water-btn:disabled { background: #d8dee6; box-shadow: none; cursor: default; }
  .water-btn:active:not(:disabled) { transform: scale(.95); }

  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photo-cell { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--pink-soft); cursor: pointer; }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-cell.selmode { outline: 2.5px solid transparent; outline-offset: -2.5px; }
  .photo-cell.selmode.sel { outline-color: var(--pink-deep); }
  .photo-cell .ph-sel { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; color: var(--pink-deep); }
  .photo-cell .ph-sel.on { background: var(--pink-deep); color: #fff; }
  .photo-cell .ph-sel svg { width: 16px; height: 16px; }
  .photo-cell.sortmode { cursor: grab; }
  .photo-cell.sortmode:active { cursor: grabbing; }
  .photo-cell .ph-rank { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; border-radius: 10px; padding: 1px 7px; }
  .photo-cell.dragging { opacity: .4; }
  .photo-cell.drag-over { outline: 2.5px dashed var(--pink-deep); outline-offset: -2.5px; }
  .photo-add { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--pink-deep); cursor: pointer; font-size: 13px; border: 2px dashed #ffb7cf; }
  .photo-add:active { background: var(--pink-bg); }

  .tabbar { position: fixed; bottom: 0; left: 0; transform: none; width: 100%; max-width: none; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255,255,255,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; z-index: 50; }
  .tabbar button { flex: 1; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #b3a2ab; font-size: 10px; position: relative; }
  .tabbar button.on { color: var(--pink-deep); }
  .tabbar button.on .tab-ic { transform: translateY(-1px) scale(1.08); }
  .tabbar .tab-ic { width: 23px; height: 23px; transition: transform .18s; }
  .tabbar .tab-ic .fill-part { opacity: 0; transition: opacity .18s; }
  .tabbar button.on .tab-ic .fill-part { opacity: 1; }

  .mask { position: fixed; inset: 0; background: rgba(70,40,55,.45); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .mask.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; bottom: 0; left: 0; transform: translateY(105%); width: 100%; max-width: none; max-height: 86dvh; overflow-y: auto; background: #fff; border-radius: 22px 22px 0 0; z-index: 95; padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); transition: transform .26s cubic-bezier(.32,.72,.35,1); }
  .sheet.open { transform: translateY(0); }
  .sheet-head { display: flex; align-items: center; margin-bottom: 14px; }
  .sheet-head h3 { font-size: 16px; font-weight: 700; flex: 1; }
  .sheet-close { border: none; background: var(--pink-bg); color: var(--pink-deep); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .field input[type="text"], .field input[type="date"], .field input[type="url"] { width: 100%; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 14px; outline: none; background: #fff; color: var(--ink); }
  .field input:focus { border-color: var(--pink); }
  .primary-btn { width: 100%; height: 46px; border: none; border-radius: 23px; cursor: pointer; background: linear-gradient(135deg, #ff8fb5, #f2558d); color: #fff; font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(242,85,141,.35); margin-top: 4px; }
  .primary-btn:active { transform: scale(.97); }
  .ghost-btn { width: 100%; height: 44px; border: 1.5px solid #ffb7cf; border-radius: 22px; cursor: pointer; background: #fff; color: var(--pink-deep); font-size: 14px; font-weight: 600; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ghost-btn:active { background: var(--pink-bg); }

  .idpick { display: flex; gap: 10px; }
  .idpick button { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
  .idpick button.on { border-color: var(--pink); background: var(--pink-bg); }
  .idpick .avatar { width: 44px; height: 44px; font-size: 16px; border-width: 2px; cursor: default; }

  .avatar-edit { display: flex; gap: 24px; justify-content: center; margin-bottom: 16px; }
  .avatar-edit .av-btn { border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .avatar-edit .avatar { width: 56px; height: 56px; border: 3px solid var(--pink-soft); position: relative; }
  .avatar-edit .cam { position: absolute; bottom: -2px; right: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--pink-deep); color: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .avatar-edit .cam svg.ic { width: 11px; height: 11px; }

  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 120; display: none; align-items: center; justify-content: center; }
  .viewer.open { display: flex; }
  .viewer img { max-width: 96vw; max-height: 86vh; border-radius: 8px; opacity: 0; transition: opacity .25s; }
  .viewer img.ready { opacity: 1; }
  .viewer .skel { position: absolute; width: min(72vw, 360px); height: min(52vh, 340px); border-radius: 10px; background: linear-gradient(100deg, #3a3338 30%, #504850 50%, #3a3338 70%); background-size: 200% 100%; animation: skel 1.2s infinite; display: none; }
  .viewer.loading .skel { display: block; }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .viewer button { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .viewer .v-del { position: absolute; top: auto; bottom: calc(26px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: auto; height: 44px; padding: 0 26px; border-radius: 22px; background: rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 600; gap: 6px; display: none; }
  .viewer .v-del svg.ic { width: 16px; height: 16px; }
  .viewer.has-del .v-del { display: flex; }

  @keyframes sheetUp { from { transform: translateY(20px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .emoji-panel .sheet-head { grid-column: 1 / -1; position: sticky; top: 0; background: var(--card); z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .emoji-panel .sheet-head::before { content: ""; position: absolute; left: 50%; top: -8px; transform: translateX(-50%); width: 42px; height: 5px; border-radius: 3px; background: var(--line); }
  .emoji-panel .sheet-head .t { font-size: 14px; font-weight: 600; color: var(--ink); padding-left: 4px; }
  .emoji-panel .sheet-head .x { border: none; background: var(--pink-bg); color: var(--pink-deep); width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer; }
  .emoji-panel .sticker-item { border: none; background: none; cursor: pointer; padding: 10px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .emoji-panel .sticker-item:active { background: var(--pink-bg); transform: scale(.92); }
  /* 表情面板打开时：聊天输入框固定在面板上方，始终可见 */
  body.emoji-open .chat-inputbar { position: fixed; left: 0; right: 0; bottom: calc(40dvh + var(--kb, 0px)); z-index: 85; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px 4px; box-shadow: 0 -2px 10px rgba(0,0,0,.05); }
  /* 键盘弹出：输入条抬到键盘上方，底栏隐藏（visualViewport 计算 --kb） */
  body.kb-open .chat-inputbar { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 90; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(4px + env(safe-area-inset-bottom)); }
  body.kb-open .tabbar { display: none; }
  body.emoji-open .chat-wrap { padding-bottom: calc(40dvh + 64px); }
  .sticker { font-size: 40px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; will-change: transform; }
  .sticker img { width: 72px; height: 72px; display: block; }
  .emoji-panel .sticker img { width: 56px; height: 56px; }
  .bubble.is-sticker .sticker img { width: 92px; height: 92px; }
  .bubble.is-sticker { background: transparent !important; box-shadow: none !important; padding: 4px 6px; }
  .bubble.is-sticker .b-time { margin-top: 2px; opacity: .45; }
  .msg-recall { text-align: center; color: var(--ink-2); font-size: 12px; margin: 8px 0; }
  .msg-menu { position: fixed; z-index: 9999; background: var(--card); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 5px; min-width: 120px; }
  .msg-menu button { display: block; width: 100%; text-align: left; padding: 11px 16px; font-size: 14px; border: none; background: none; color: var(--ink); border-radius: 8px; cursor: pointer; }
  .msg-menu button:active { background: var(--pink-bg); }
  .msg-menu button.danger { color: #ff4d6d; }
  .b-read { font-size: 10px; color: var(--ink-2); margin-left: 6px; }
  .bubble-row.me .b-read { color: var(--pink-deep); }
  /* ===== 动态表情动画（仿 QQ 动图贴纸） ===== */
  @keyframes st-heartbeat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.22); } 50% { transform: scale(.94); } 75% { transform: scale(1.12); } }
  @keyframes st-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes st-shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  @keyframes st-wobble { 0%,100% { transform: rotate(0) translateX(0); } 20% { transform: rotate(8deg) translateX(3px); } 40% { transform: rotate(-8deg) translateX(-3px); } 60% { transform: rotate(6deg) translateX(2px); } 80% { transform: rotate(-6deg) translateX(-2px); } }
  @keyframes st-breath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.16); } }
  @keyframes st-twinkle { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: .55; } }
  @keyframes st-spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
  @keyframes st-throw { 0% { transform: translate(0,0) scale(1) rotate(0); } 30% { transform: translate(14px,-22px) scale(1.15) rotate(12deg); } 60% { transform: translate(26px,-6px) scale(1) rotate(-8deg); } 100% { transform: translate(34px,8px) scale(.9) rotate(0); } }
  @keyframes st-rock { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  @keyframes st-sway { 0%,100% { transform: translateX(-6px) rotate(-6deg); } 50% { transform: translateX(6px) rotate(6deg); } }
  @keyframes st-purr { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08) translateY(-2px); } }
  .anim-heartbeat { animation: st-heartbeat 1.2s ease-in-out infinite; }
  .anim-bounce { animation: st-bounce 1s ease-in-out infinite; }
  .anim-shake { animation: st-shake .5s ease-in-out infinite; }
  .anim-wobble { animation: st-wobble 1.4s ease-in-out infinite; }
  .anim-breath { animation: st-breath 2.4s ease-in-out infinite; }
  .anim-twinkle { animation: st-twinkle 1.6s ease-in-out infinite; }
  .anim-spin { animation: st-spin 3s linear infinite; }
  .anim-throw { animation: st-throw 1.8s ease-in-out infinite; }
  .anim-rock { animation: st-rock 1.2s ease-in-out infinite; }
  .anim-sway { animation: st-sway 2s ease-in-out infinite; }
  .anim-purr { animation: st-purr .8s ease-in-out infinite; }
</style>
</head>

    spaceName: "恋人空间",

    anniversaries: [],

    albums: [],
    photos: [],
    selfies: [],
    miss: [],
    _deleted: { messages: [], anniversaries: [], moods: [], photos: [], selfies: [], albums: [] },
    theme: { color: "#ff7ba9", dark: false, font: "default" },
    selfieUrge: null
  };
  var data = null;
  var me = parseInt(localStorage.getItem(LS_ID) || "0", 10) || 0;
  var room = (localStorage.getItem(LS_ROOM) || "").trim();
  var localMode = false;
  var backend = { enabled: false, ts: 0 };
  var pollTimer = null;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function loadLocal() {
    try { data = JSON.parse(localStorage.getItem(LS_DATA)); } catch (e) { data = null; }
    if (!data || typeof data !== "object") { try { var bk = JSON.parse(localStorage.getItem("loverspace.backup.v1")); if (bk && bk.data) data = bk.data; } catch (e) {} }
    if (!data || typeof data !== "object") data = clone(DEFAULT);
    for (var k in DEFAULT) if (!(k in data)) data[k] = clone(DEFAULT[k]);
    if (!data.tree || typeof data.tree !== "object") data.tree = { growth: 0, lastWater: [0, 0] };
    if (!Array.isArray(data.tree.lastWater)) data.tree.lastWater = [0, 0];
    if (!Array.isArray(data.selfies)) data.selfies = [];
    if (!data._deleted || typeof data._deleted !== "object") data._deleted = { messages: [], anniversaries: [], moods: [], photos: [], selfies: [], albums: [] };
    // 旧版扁平 photos 迁移进默认相册
    if (!Array.isArray(data.albums)) data.albums = [];
    if (Array.isArray(data.photos) && data.photos.length) { data.albums.unshift({ id: uid(), name: "我们的日常", photos: data.photos, ts: Date.now() }); data.photos = []; }
    if (!data.albums.length) data.albums.push({ id: uid(), name: "我们的日常", photos: [], ts: Date.now() });
    if (!data.tree.tasks) data.tree.tasks = [];
    if (!Array.isArray(data.tree.feed)) data.tree.feed = [0, 0];
    if (!Array.isArray(data.tree.play)) data.tree.play = [0, 0];
    if (!data.tree.pet || typeof data.tree.pet !== "object") data.tree.pet = { name: "小甜", hunger: 100, mood: 100, lastFed: 0, lastPlay: 0, lvl: 1, cared: 0 };
    if (!data.tree.daily || typeof data.tree.daily !== "object") data.tree.daily = { date: "", acts: { water: [0, 0], feed: [0, 0], play: [0, 0] }, claimed: {} };
    if (!data.tree.daily.acts || typeof data.tree.daily.acts !== "object") data.tree.daily.acts = { water: [0, 0], feed: [0, 0], play: [0, 0] };
    if (!data.tree.daily.claimed || typeof data.tree.daily.claimed !== "object") data.tree.daily.claimed = {};
    if (typeof data.tree.daily.date !== "string") data.tree.daily.date = "";
    if (!data.theme || typeof data.theme !== "object") data.theme = { color: "#ff7ba9", dark: false, font: "default" };

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(okMsg || "已复制"); } catch (e) {
        openSheet("请手动复制", '<textarea style="width:100%;height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px">' + esc(text) + "</textarea>");
      }

    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg || "已复制"); }, fallback);
    } else fallback();

  function openBackup() {
    var html = '<div style="font-size:13px;color:var(--ink-2);margin-bottom:12px">备份文件包含全部数据，可在另一台设备导入恢复。</div>' +
      '<button class="ghost-btn" id="bkExport" style="margin-top:0">' + icon("download") + " 导出备份文件</button>" +
      '<button class="ghost-btn" id="bkImport">' + icon("upload") + " 导入备份文件</button>" +
      '<button class="ghost-btn" id="bkShareUrl">' + icon("link") + " 复制同步链接（发给TA）</button>";
    openSheet("备份与恢复", html);
    $("bkExport").addEventListener("click", function () {
      function dl(blob, name) {
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      }
      var snap = clone(data);
      // 收集所有云端原图文件名
      var names = {};
      (snap.albums || []).forEach(function (al) {
        (al.photos || []).forEach(function (p) {
          if (p.src && p.src.indexOf("/uploads/") === 0) names[p.src.split("/").pop()] = true;
        });
      });
      var keys = Object.keys(names);
      function done(images) {
        var blob = new Blob([JSON.stringify({ version: 2, data: snap, images: images || {} })], { type: "application/json" });
        dl(blob, "loverspace-backup-" + todayStr() + ".json");
        toast("备份文件已导出" + (keys.length ? "（含 " + Object.keys(images || {}).length + " 张原图）" : ""));
        closeSheet();
      }
      if (!keys.length) return done({});
      toast("正在打包原图 " + keys.length + " 张…");
      Promise.all(keys.map(function (nm) {
        return fetch("/uploads/" + nm).then(function (r) { return r.blob(); }).then(function (b) {
          return new Promise(function (res) {
            var fr = new FileReader();
            fr.onload = function () { names[nm] = fr.result; res(); };
            fr.onerror = function () { names[nm] = null; res(); };
            fr.readAsDataURL(b);
          });
        }).catch(function () { names[nm] = null; });
      })).then(function () {
        var images = {}; keys.forEach(function (nm) { if (names[nm]) images[nm] = names[nm]; });
        done(images);
      });
    });
    $("bkImport").addEventListener("click", function () {
      var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          try {
            var bundle = JSON.parse(r.result);
            var d = bundle.data || bundle; // 兼容旧版（无 version/images 的纯 data 备份）
            if (!d || !d.partners) throw 0;
            for (var k in DEFAULT) if (!(k in d)) d[k] = clone(DEFAULT[k]);
            data = d; data._updated = Date.now();
            var imgs = bundle.images || {};
            var keys = Object.keys(imgs);
            function finish() { save(); renderAll(); closeSheet(); toast("导入成功" + (keys.length ? "（已恢复 " + keys.length + " 张原图）" : "")); }
            if (!keys.length) return finish();
            toast("正在恢复原图 " + keys.length + " 张…");
            fetch("/api/restore-images", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ images: imgs }) })
              .then(function () { finish(); }).catch(function () { finish(); });
          } catch (e) { toast("文件格式不对，导入失败"); }
        };
        r.readAsText(f);
      };
      inp.click();
    });
    $("bkShareUrl").addEventListener("click", function () { closeSheet(); setTimeout(doShare, 200); });
  }

  function bindGate() {
    var gate = $("roomGate");
    function hide() { gate.classList.add("hide"); }
    $("gateCreate").addEventListener("click", function () {
      var btn = this;
      btn.disabled = true; btn.textContent = "探测云端…";
      $("gateErr").textContent = "";
      probe(function (t) { btn.textContent = t; }).then(function (mode) {
        if (!mode) {
          btn.disabled = false; btn.textContent = "创建共享空间";
          $("gateErr").textContent = "内置云端和 Supabase 都连不上，请检查网络后重试";
          return;
        }
        chooseBackend(mode);
        btn.textContent = "创建中…";
        var tries = 0;
        function attempt() {
          tries++;
          roomApi("POST").then(function (r) {
            if (r && r.id) {
              room = r.id; localStorage.setItem(LS_ROOM, room); backend.enabled = true;
              setEncPwd(($("gatePwd").value || "").trim());
              hide(); bootApp(); toast("空间已创建（" + cloudName() + "），把空间码「" + room + "」发给TA一起加入");
            } else if (tries < 4) {
              btn.textContent = "连不上，正在重试 " + (tries + 1) + "/4…";
              setTimeout(attempt, 2000);
            } else {
              btn.disabled = false; btn.textContent = "创建共享空间";
              $("gateErr").textContent = "创建失败" + (r && r.error ? "：" + r.error : "");
            }
          });
        }
        attempt();
      });
    });
    $("gateJoin").addEventListener("click", function () {
      var code = ($("gateCode").value || "").trim().toUpperCase();
      if (!code) { $("gateErr").textContent = "请输入空间码"; return; }
      var btn = this;
      btn.disabled = true; btn.textContent = "连接云端中…";
      $("gateErr").textContent = "";
      var tries = 0;
      function attempt() {
        tries++;
        localRequest("GET", code).then(function (a) {
          function done(mode, r) {
            chooseBackend(mode);
            me = 1; localStorage.setItem(LS_ID, "1");
            room = code; localStorage.setItem(LS_ROOM, room); backend.enabled = true;
            setEncPwd(($("gatePwd").value || "").trim());
            hide(); bootApp(); toast("已加入空间 " + code + "（" + cloudName() + "）");
          }
          if (a && a.exists === true) return done("local", a);
          var sbP = sbReady() ? sbRequest("GET", code) : Promise.resolve(null);
          sbP.then(function (b) {
            if (b && b.exists === true) return done("sb", b);
            if ((a && !a.error) || (b && !b.error)) {
              btn.disabled = false; btn.textContent = "加入已有空间";
              $("gateErr").textContent = "空间码「" + code + "」不存在，请找对方核对一下";
            } else if (tries < 4) {
              btn.textContent = "连不上，正在重试 " + (tries + 1) + "/4…";
              setTimeout(attempt, 2000);
            } else {
              btn.disabled = false; btn.textContent = "加入已有空间";
              $("gateErr").textContent = "云端都连不上" + (a && a.error ? "（" + a.error + "）" : "");
            }
          });
        });
      }
      attempt();
    });
    $("gateLocal").addEventListener("click", function () { localMode = true; hide(); bootApp(); });
    // 已有房间码：直接“进入我的空间”，避免每次重新创建
    if (room) {
      var ge = $("gateEnter");
      ge.style.display = "";
      ge.textContent = "进入我的空间（" + room + "）";
      ge.addEventListener("click", function () { hide(); bootApp(); });
    }
  }

      if (fsEl) { lockPortrait(); return; }
      var el = document.documentElement;
      var p = null;
      if (el.requestFullscreen) p = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
      else { toast("当前浏览器不支持全屏"); return; }
      if (p && p.then) p.then(lockPortrait).catch(function () {});
    } catch (e) { toast("当前浏览器不支持全屏"); }
  }
  function exitFs() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    if (screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch (e) {} }
  }
  var fsManuallyExited = false;
  var appReady = false;
  function detachAutoFs() {
    document.removeEventListener("pointerdown", autoFs);
    document.removeEventListener("touchstart", autoFs);
  }
  // 进入网页：主界面就绪后，第一次用户手势自动进入竖屏全屏；持续重试直到真正进入（避免欢迎页点击时视图切换取消全屏请求）
  function autoFs() {
    if (fsManuallyExited) { detachAutoFs(); return; }
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) { detachAutoFs(); return; }
    if (appReady) enterFs();
  }
  document.addEventListener("pointerdown", autoFs);
  document.addEventListener("touchstart", autoFs);
  $("fsBtn").addEventListener("click", function () {
    if (document.fullscreenElement || document.webkitFullscreenElement) { exitFs(); fsManuallyExited = true; detachAutoFs(); }
    else { enterFs(); fsManuallyExited = false; }
  });
  // 切到后台时直接退出全屏，回到前台即普通竖屏模式，避免卡顿与横屏伪竖屏问题
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) exitFs();
  });
  document.addEventListener("fullscreenchange", syncFsMode);
  document.addEventListener("webkitfullscreenchange", syncFsMode);
  function syncFsMode() {
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    document.body.classList.toggle("fs-mode", !!fs);
    var b = $("fsBtn"); if (b) b.textContent = fs ? "⤡" : "⛶";
    if (fs) { lockPortrait(); detachAutoFs(); }  }

  /* 顶部状态栏：实时时间 + 每日更新情话（按日期取，当天固定） */
  (function () {
    var sbq = $("sbQuote");
    var QUOTES = [
      "遇见你，是我所有运气的总和。",

      "春风十里，不如你。",
      "我把所有的温柔都留给了你。",
      "被你爱着，是我此生最大的幸运。",
      "你是我平淡生活里的那束光。",
      "喜欢你，是我做过最勇敢的事。",
      "想和你一起浪费时光，把日子过成诗。",
      "你是我藏在心底最甜的秘密。",
      "余生很长，请多多指教。",
      "因为是你，所以值得。",
      "你笑起来，全世界都亮了。",
      "这一生，只够爱一个人，那个人是你。",
      "我的欢喜，都与你有关。",
      "想牵着你的手，从心动走到古稀。",
      "你是我的今天，也是我的明天。",
      "万物皆有裂痕，那是光照进来的地方——比如你。",
      "喜欢你，是始料未及的温柔。",
      "你是我所有计划里，最不想改的那一项。",
      "有你在，便是最好的时光。",
      "我把浪漫存进每一天，等你来取。",
      "你是我的软肋，也是我的铠甲。",
      "心动不是答案，心定才是。",
      "愿有岁月可回首，且以深情共白头。",
      "想和你虚度时光，比如低头看鱼。",
      "你是我疲惫生活里的英雄梦想。",
      "所有的不期而遇，都是你。",
      "我喜欢的样子，你都有。",
      "陪你奇奇怪怪，懂你可可爱爱。",
      "你是我这辈子最想留住的风景。",
      "风很自由，我想和你一起走。",
      "你的出现，让我相信了爱情。",
      "星河滚烫，你是人间理想。",
      "我绕过江山错落，才发现你是人间星火。",
      "想把你写进诗里，又怕韵脚太俗。",
      "你是我藏在云层里的月亮。",
      "慢慢来，我们有一辈子。",
      "你是我所有温柔的来处与归途。",
      "哪怕世界荒芜，你仍是我的信徒。",
      "喜欢是棋逢对手，爱是甘拜下风。",
      "你是我写过最美的情书。",
      "想和你一起，把平凡过成节日。",
      "你是我的小确幸，也是大欢喜。",
      "世界再吵，有你便安静。",
      "我把最真的喜欢，都藏进了日常。",
      "你是我不想和别人分享的宝贝。",
      "愿得一人心，白首不相离。",
      "你是我所有温柔的尽头。",
      "爱你是我的本能。",
      "想和你一起慢慢变老。",
      "你是我目光所及，皆是欢喜。",
      "所有的美好，都因你而具象。",
      "你是我心尖上的朱砂痣。",
      "有你，便有了四季。",
      "你是我所有温柔的理由。"
    ];
    function dailyQuote() {
      var now = new Date();
      var start = new Date(now.getFullYear(), 0, 0);
      var day = Math.floor((now - start) / 86400000);
      return QUOTES[day % QUOTES.length];
    }
    function tickClock() {
      var d = new Date();
      var h = d.getHours(), m = d.getMinutes();
      var t = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
      var sc = $("sbClock"); if (sc) sc.textContent = t;
    }
    if (sbq) sbq.textContent = dailyQuote();
    tickClock();
    setInterval(tickClock, 10000);
  })();

  /* 键盘弹出适配：用 visualViewport 算出键盘遮挡高度 --kb，
     输入条 fixed 抬到键盘上方、底栏隐藏；全屏模式下视口不 resize，此方案也能生效 */
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var wasOpen = false;
    function onVV() {
      var kb = Math.round(Math.max(0, window.innerHeight - vv.height - vv.offsetTop));
      var open = kb > 120;
      document.body.style.setProperty("--kb", kb + "px");
      if (open !== wasOpen) {
        wasOpen = open;
        document.body.classList.toggle("kb-open", open);
        if (open && document.getElementById("view-chat") && document.getElementById("view-chat").style.display !== "none") {
          setTimeout(scrollChatBottom, 60);
        }
      }
    }
    vv.addEventListener("resize", onVV);
    vv.addEventListener("scroll", onVV);
    onVV();
  })();

  $("mask").addEventListener("click", closeSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("miProfile").addEventListener("click", openProfile);
  $("miAnni").addEventListener("click", openAnniSheet);
  $("miMood").addEventListener("click", openMoodTimeline);
  $("miTree").addEventListener("click", openTreeSheet);
  $("miId").addEventListener("click", openIdentity);
  $("miShare").addEventListener("click", doShare);
  $("miPriv").addEventListener("click", openPrivacy);
  $("miBackup").addEventListener("click", openBackup);
  $("miSb").addEventListener("click", openSbConfig);
  $("miSet").addEventListener("click", openSettings);
  document.getElementById("app").addEventListener("click", function (e) {
    if (e.target.closest("#homeAv0") || e.target.closest("#homeAv1")) openProfile();
  });

  tryImportFromHash();
  if (room) { $("roomGate").classList.add("hide"); bootApp(); } else { bindGate(); }

  // ===== 移动端返回键：子界面优先关闭，根界面两次返回才退出 =====
  // 手机实体返回键 / 滑动返回都会触发 popstate，用 History API 拦截
  var lastBack = 0;
  function topLayer() {
    if ($("viewer") && $("viewer").classList.contains("open")) return "viewer";
    if ($("sheet") && $("sheet").classList.contains("open")) return "sheet";
    if (albumState && albumState.mode === "open") return "album";
    return null;
  }
  function appBack() {
    // 相册处于管理/排序模式 -> 返回先退出模式（不退出相册）
    if (albumState.mode === "open" && albumMode !== "normal") {
      albumMode = "normal"; albumSel = {}; sortSrc = null; renderAlbum(); return;
    }
    var top = topLayer();
    // 照片查看器打开 -> 先关照片（最顶层，优先级最高）
    if (top === "viewer") { closeViewer(); return; }
    // 有弹窗 -> 仅关闭弹窗（打开时已压入一层历史，返回手势会自动退掉该层，无需再补压）
    if (top === "sheet") { closeSheetUI(); return; }
    // 相册打开了 -> 只退回相册列表（打开时已压入一层历史，返回键自动退掉该层）
    if (top === "album") { albumState = { mode: "list", id: null }; albumMode = "normal"; albumSel = {}; sortSrc = null; renderAlbum(); return; }
    // 根界面：连续两次返回才退出
    var now = Date.now();
    if (now - lastBack < 2000) {
      lastBack = 0;
      // 真正离开：退掉我们加的“守卫”历史并退出应用
      try { history.go(-history.length); } catch (e) {}
      setTimeout(function () { try { history.back(); } catch (e) {} }, 40);
      return;
    }
    lastBack = now;
    toast("再按一次退出");
    history.pushState({ app: 1 }, "");
    setTimeout(function () { if (Date.now() - lastBack < 2000) lastBack = 0; }, 2000);
  }
  window.addEventListener("popstate", appBack);
  // 启动时为根界面加一道“守卫”历史，保证返回键可被拦截（不会被直接关站）
  history.pushState({ app: 1 }, "");

  // ===== 启动图：网页内全屏，整图完整显示（不裁切），点击任意位置可跳过 =====
  var bootHidden = false;
  function hideBoot() {
    if (bootHidden) return;
    bootHidden = true;
    var b = document.getElementById("boot");
    if (!b) return;
    b.classList.add("hide");
    setTimeout(function () { if (b && b.parentNode) b.parentNode.removeChild(b); }, 500);
  }
  (function () {
    var bi = document.getElementById("bootImg");
    if (bi && data && data.splash) bi.src = data.splash;
    var b = document.getElementById("boot");
    if (b) b.addEventListener("click", hideBoot);
  })();
  setTimeout(hideBoot, 4000);
})();
</script>
