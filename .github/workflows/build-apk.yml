name: Build Android APK (恋人空间)

on:
  workflow_dispatch:        # 手动触发：Actions 页面点 Run workflow
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}   # 仓库 Settings → Secrets and variables → Variables 里设置
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Inject backend URL into app
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::未设置仓库变量 BACKEND_URL，APK 将使用占位地址，安装后无法连接。请在仓库 Variables 中设置你的后端地址后再构建。"
          else
            echo "注入后端地址: $BACKEND_URL"
            sed -i "s#https://REPLACE_WITH_YOUR_BACKEND_URL#$BACKEND_URL#g" capacitor.config.json
            sed -i "s#https://REPLACE_WITH_YOUR_BACKEND_URL#$BACKEND_URL#g" android/app/src/main/assets/capacitor.config.json
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loverspace-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
