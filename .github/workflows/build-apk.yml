name: Build Android APK (恋人空间)

on:
  workflow_dispatch:        # 手动触发：Actions 页面点 Run workflow
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}   # 仓库 Settings → Secrets and variables → Variables 里设置
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK manually
        run: |
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools"
          echo "下载 cmdline-tools ..."
          curl -sL --max-time 300 -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin" 2>/dev/null || true
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "SDK 安装完成："
          ls "$SDK"

      - name: Install app dependencies (Capacitor CLI)
        run: npm ci

      - name: Inject backend URL into app
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::未设置仓库变量 BACKEND_URL，APK 将使用占位地址，安装后无法连接。请在仓库 Variables 中设置你的后端地址后再构建。"
          else
            echo "注入后端地址: $BACKEND_URL"
            sed -i "s#https://REPLACE_WITH_YOUR_BACKEND_URL#$BACKEND_URL#g" capacitor.config.json
          fi

      - name: Capacitor sync (生成安卓嵌入配置与资源)
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loverspace-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
